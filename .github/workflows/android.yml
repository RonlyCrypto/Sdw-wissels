name: Android-app (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Web-bestanden klaarzetten
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-*.png www/
      - name: Capacitor-project maken
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: App-icoon zetten
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              [ -f "$d/$f" ] && cp icon-512.png "$d/$f" || true
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      - name: APK bouwen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SDW-Wissels.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SDW-Wissels-apk
          path: SDW-Wissels.apk
      - name: Op de Releases-pagina zetten
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: SDW Wissels (Android)
          body: Download SDW-Wissels.apk op je Android-telefoon en open het bestand om te installeren.
          files: SDW-Wissels.apk
          make_latest: true
